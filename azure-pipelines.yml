trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  apiProject: 'EasyHMSAPI.Api/EasyHMSAPI.Api.csproj'
  publishDir: '$(Build.ArtifactStagingDirectory)/publish'
  artifactName: 'api-drop'

  devAppName: 'easyHMSAPIServices'
  devResourceGroup: 'website-dev-rg'

  qaAppName: 'easyHMSAPISevices'
  qaResourceGroup: 'website-qa-rg'

  # Smoke Test Config
  smokeBaseUrl: 'https://easyhmsapiservices-bgasabd9ddbbdden.centralindia-01.azurewebsites.net'

stages:

# ===================== Build =====================
- stage: Build
  displayName: Build & Package API
  jobs:
  - job: BuildJob
    steps:
    - task: UseDotNet@2
      displayName: 'Use .NET 8 SDK'
      inputs:
        version: '8.x'

    - task: DotNetCoreCLI@2
      displayName: 'Restore'
      inputs:
        command: 'restore'
        projects: '$(apiProject)'

    - task: DotNetCoreCLI@2
      displayName: 'Build'
      inputs:
        command: 'build'
        projects: '$(apiProject)'
        arguments: '--configuration Release --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Publish (zip)'
      inputs:
        command: 'publish'
        projects: '$(apiProject)'
        arguments: '--configuration Release --no-restore --output $(publishDir)'
        publishWebProjects: false
        zipAfterPublish: true

    - publish: $(publishDir)
      artifact: $(artifactName)

# ===================== Deploy to Dev =====================
- stage: Deploy_Dev
  displayName: Deploy to App Service (Dev)
  dependsOn: Build
  jobs:
  - deployment: DeployDev
    environment: 'dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: $(artifactName)

          - task: AzureWebApp@1
            displayName: 'Deploy ZIP to Dev App Service'
            inputs:
              azureSubscription: 'svc-conn-nexeagle-dev'
              appType: 'webAppLinux'
              appName: '$(devAppName)'
              package: '$(Pipeline.Workspace)/$(artifactName)/**/*.zip'

          # ================= SMOKE TEST START =================
          - task: UsePythonVersion@0
            displayName: 'Use Python 3.11'
            inputs:
              versionSpec: '3.11'

          - script: |
              cd tests/smoke
              pip install -r requirements.txt
              pytest --junitxml=smoke-results.xml
            displayName: 'Run Smoke Tests (DEV)'
            env:
              BASE_URL: $(smokeBaseUrl)

          - task: PublishTestResults@2
            displayName: 'Publish Smoke Test Results'
            inputs:
              testResultsFiles: 'tests/smoke/smoke-results.xml'
              testRunTitle: 'Smoke Tests - DEV'
            condition: succeededOrFailed()
          # ================= SMOKE TEST END =================

# ===================== Deploy to QA =====================
- stage: Deploy_QA
  displayName: Deploy to App Service (QA)
  dependsOn: Deploy_Dev
  condition: succeeded()   #  QA deploy tabhi hoga jab smoke pass
  jobs:
  - deployment: DeployQA
    environment: 'qa'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: $(artifactName)

          - task: AzureWebApp@1
            displayName: 'Deploy ZIP to QA App Service'
            inputs:
              azureSubscription: 'svc-conn-nexeagle-qa'
              appType: 'webAppLinux'
              appName: '$(qaAppName)'
              package: '$(Pipeline.Workspace)/$(artifactName)/**/*.zip'
# ================================================================
#  STAGE 4 — Deploy PROD (release-* + env approval, no time gate)
#  NOTE: Configure approval in Pipelines → Environments → prod
# ================================================================
- stage: Deploy_Prod
  displayName: Deploy to App Service (PROD) — Environment Approval
  dependsOn: Deploy_QA
  condition: >
    and(
      succeeded(),
      startsWith(variables['Build.SourceBranch'], 'refs/heads/release-'),
      eq('${{ parameters.deployProd }}', 'true')
    )
  jobs:
  - deployment: DeployProd
    environment: 'prod'  # add Approvals & Checks to this Environment
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: $(artifactName)

          - task: AzureWebApp@1
            displayName: 'Deploy ZIP to PROD App Service'
            inputs:
              azureSubscription: '$(prodServiceConnection)'
              appType: 'webAppLinux'
              appName: '$(prodAppName)'
              package: '$(Pipeline.Workspace)/$(artifactName)/**/*.zip'