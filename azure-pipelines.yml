# ============================================
#   Build & Deploy EasyHMS API (.NET 8)
#   Dev deploy: release-* AND feature/*
#   QA deploy: release-* only (recommended)
#   PROD deploy: release-* + env approval (no time gate)
# ============================================

parameters:
- name: deployProd
  type: boolean
  default: false     # set true at run time to enable PROD stage

trigger:
  branches:
    include:
      - 'release-*'
      - 'feature/*'

pr:
  branches:
    include:
      - 'release-*'
      - 'feature/*'

pool:
  vmImage: 'ubuntu-latest'

# ==== EDIT THESE VALUES ====
variables:
  apiProject: 'EasyHMSAPI.Api/EasyHMSAPI.Api.csproj'
  publishDir: '$(Build.ArtifactStagingDirectory)/publish'
  artifactName: 'api-drop'

  # Dev App Service
  devAppName: 'easyHMSAPIServices'
  devResourceGroup: 'website-dev-rg'

  # QA App Service
  qaAppName: 'easyHMSAPISevices'
  qaResourceGroup: 'website-qa-rg'

  # ======== PROD (add your values) ========
  prodAppName: 'easyHMSAPISevicesProd'          # <— CHANGE to your PROD app name
  prodResourceGroup: 'website-prod-rg'           # <— CHANGE to your PROD RG
  prodServiceConnection: 'svc-conn-nexeagle-prod' # <— CHANGE to your PROD service connection

# ================================================================
#  STAGE 1 — Build Artifacts (Runs for both release-* & feature/*)
# ================================================================
stages:
- stage: Build
  displayName: Build & Package API
  jobs:
  - job: BuildJob
    steps:
    - task: UseDotNet@2
      displayName: 'Use .NET 8 SDK'
      inputs:
        version: '8.x'

    - task: DotNetCoreCLI@2
      displayName: 'Restore'
      inputs:
        command: 'restore'
        projects: '$(apiProject)'

    - task: DotNetCoreCLI@2
      displayName: 'Build'
      inputs:
        command: 'build'
        projects: '$(apiProject)'
        arguments: '--configuration Release --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Publish (zip)'
      inputs:
        command: 'publish'
        projects: '$(apiProject)'
        arguments: '--configuration Release --no-restore --output $(publishDir)'
        publishWebProjects: false
        zipAfterPublish: true

    - publish: $(publishDir)
      artifact: $(artifactName)

# ================================================================
#  STAGE 2 — Deploy DEV
#  Runs for release-* AND feature/*
# ================================================================
- stage: Deploy_Dev
  displayName: Deploy to App Service (Dev)
  dependsOn: Build
  condition: >
    and(
      succeeded(),
      or(
        startsWith(variables['Build.SourceBranch'], 'refs/heads/release-'),
        startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/')
      )
    )
  jobs:
  - deployment: DeployDev
    environment: 'dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: $(artifactName)

          - task: AzureWebApp@1
            displayName: 'Deploy ZIP to Dev App Service'
            inputs:
              azureSubscription: 'svc-conn-nexeagle-dev'
              appType: 'webAppLinux'
              appName: '$(devAppName)'
              package: '$(Pipeline.Workspace)/$(artifactName)/**/*.zip'

# ================================================================
#  STAGE 3 — Deploy QA
#  (Recommended: Only for release-*; feature/* should not go to QA)
# ================================================================
- stage: Deploy_QA
  displayName: Deploy to App Service (QA)
  dependsOn: Deploy_Dev
  condition: >
    and(
      succeeded(),
      startsWith(variables['Build.SourceBranch'], 'refs/heads/release-')
    )
  jobs:
  - deployment: DeployQA
    environment: 'qa'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: $(artifactName)

          - task: AzureWebApp@1
            displayName: 'Deploy ZIP to QA App Service'
            inputs:
              azureSubscription: 'svc-conn-nexeagle-qa'
              appType: 'webAppLinux'
              appName: '$(qaAppName)'
              package: '$(Pipeline.Workspace)/$(artifactName)/**/*.zip'

# ================================================================
#  STAGE 4 — Deploy PROD (release-* + env approval, no time gate)
#  NOTE: Configure approval in Pipelines → Environments → prod
# ================================================================
- stage: Deploy_Prod
  displayName: Deploy to App Service (PROD) — Environment Approval
  dependsOn: Deploy_QA
  condition: >
    and(
      succeeded(),
      startsWith(variables['Build.SourceBranch'],'refs/heads/release-'),
      eq('${{ parameters.deployProd }}','true')
    )
  jobs:
  - deployment: DeployProd
    environment: 'prod'  # add Approvals & Checks to this Environment
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: $(artifactName)

          # (Optional but recommended) Ensure app is Running to avoid 403 "Site Disabled"
          - task: AzureCLI@2
            displayName: 'Ensure PROD App is Running'
            inputs:
              azureSubscription: '$(prodServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                RG='$(prodResourceGroup)'
                APP='$(prodAppName)'
                state=$(az webapp show -g "$RG" -n "$APP" --query state -o tsv || echo "")
                echo "Current state: ${state:-Unknown}"
                if [ "$state" != "Running" ]; then
                  echo "Starting app..."
                  az webapp start -g "$RG" -n "$APP"
                fi

          - task: AzureWebApp@1
            displayName: 'Deploy ZIP to PROD App Service'
            inputs:
              azureSubscription: '$(prodServiceConnection)'
              appType: 'webAppLinux'
              appName: '$(prodAppName)'
              package: '$(Pipeline.Workspace)/$(artifactName)/**/*.zip'
