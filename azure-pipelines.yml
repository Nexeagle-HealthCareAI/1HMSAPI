# ============================================
#   Build & Deploy EasyHMS API (.NET 8)
#   Dev deploy: release-* AND feature/*
#   QA deploy: release-* only (recommended)
# ============================================

trigger:
  branches:
    include:
      - 'release-*'
      - 'feature/*'

pr:
  branches:
    include:
      - 'release-*'
      - 'feature/*'

parameters:
- name: deployProd
  type: boolean
  default: false     # set true at run time to allow PROD
- name: prodReleaseDateUtc
  type: string
  default: ''        # e.g. "2025-12-05 10:30:00" (UTC)

pool:
  vmImage: 'ubuntu-latest'

# ==== EDIT THESE VALUES ====
variables:
  apiProject: 'EasyHMSAPI.Api/EasyHMSAPI.Api.csproj'
  publishDir: '$(Build.ArtifactStagingDirectory)/publish'
  artifactName: 'api-drop'

  # Dev App Service
  devAppName: 'easyHMSAPIServices'
  devResourceGroup: 'website-dev-rg'

  # QA App Service
  qaAppName: 'easyHMSAPISevices'
  qaResourceGroup: 'website-qa-rg'

   # PROD App Service
  prodAppName: 'easyHMSAPISevicesProd'              
  prodResourceGroup: 'website-prod-rg'

# ================================================================
#  STAGE 1 — Build Artifacts (Runs for both release-* & feature/*)
# ================================================================
stages:
- stage: Build
  displayName: Build & Package API
  jobs:
  - job: BuildJob
    steps:
    - task: UseDotNet@2
      displayName: 'Use .NET 8 SDK'
      inputs:
        version: '8.x'

    - task: DotNetCoreCLI@2
      displayName: 'Restore'
      inputs:
        command: 'restore'
        projects: '$(apiProject)'

    - task: DotNetCoreCLI@2
      displayName: 'Build'
      inputs:
        command: 'build'
        projects: '$(apiProject)'
        arguments: '--configuration Release --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Publish (zip)'
      inputs:
        command: 'publish'
        projects: '$(apiProject)'
        arguments: '--configuration Release --no-restore --output $(publishDir)'
        publishWebProjects: false
        zipAfterPublish: true

    - publish: $(publishDir)
      artifact: $(artifactName)

# ================================================================
#  STAGE 2 — Deploy DEV
#  Runs for release-* AND feature/*
# ================================================================
- stage: Deploy_Dev
  displayName: Deploy to App Service (Dev)
  dependsOn: Build
  condition: >
    and(
      succeeded(),
      or(
        startsWith(variables['Build.SourceBranch'], 'refs/heads/release-'),
        startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/')
      )
    )
  jobs:
  - deployment: DeployDev
    environment: 'dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: $(artifactName)

          - task: AzureWebApp@1
            displayName: 'Deploy ZIP to Dev App Service'
            inputs:
              azureSubscription: 'svc-conn-nexeagle-dev'
              appType: 'webAppLinux'
              appName: '$(devAppName)'
              package: '$(Pipeline.Workspace)/$(artifactName)/**/*.zip'

# ================================================================
#  STAGE 3 — Deploy QA
#  (Recommended: Only for release-*; feature/* should not go to QA)
# ================================================================
- stage: Deploy_QA
  displayName: Deploy to App Service (QA)
  dependsOn: Deploy_Dev
  condition: >
    and(
      succeeded(),
      startsWith(variables['Build.SourceBranch'], 'refs/heads/release-')
    )
  jobs:
  - deployment: DeployQA
    environment: 'qa'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: $(artifactName)

          - task: AzureWebApp@1
            displayName: 'Deploy ZIP to QA App Service'
            inputs:
              azureSubscription: 'svc-conn-nexeagle-qa'
              appType: 'webAppLinux'
              appName: '$(qaAppName)'
              package: '$(Pipeline.Workspace)/$(artifactName)/**/*.zip'
# ================================================================
#  STAGE 4 — Deploy PROD (release-* + date gate + approvals)
# ================================================================
- stage: Deploy_Prod
  displayName: Deploy to App Service (PROD)
  dependsOn: Deploy_QA
  condition: >
    and(
      succeeded(),
      startsWith(variables['Build.SourceBranch'], 'refs/heads/release-'),
      eq('${{ parameters.deployProd }}', 'true')
    )
  jobs:
  - deployment: DeployProd
    environment: 'prod'    # Create an Environment 'prod' and add Approvals & Checks
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: $(artifactName)

          # --- Gate: Enforce a specific UTC release date/time ---
          - bash: |
              set -euo pipefail
              REL='${{ parameters.prodReleaseDateUtc }}'
              if [ -z "$REL" ]; then
                echo "Parameter prodReleaseDateUtc is required for PROD."; exit 1
              fi
              now=$(date -u +%s)
              rel=$(date -u -d "$REL" +%s || true)
              if [ -z "$rel" ]; then
                echo "Invalid prodReleaseDateUtc format: $REL"
                echo "Use e.g. '2025-12-05 10:30:00' (UTC)"; exit 1
              fi
              if [ $now -lt $rel ]; then
                echo "Release blocked until $REL UTC"; exit 2
              fi
              echo "Release date gate passed (now >= $REL UTC)."
            displayName: 'Gate: PROD release date (UTC)'

          # --- Optional inline approval in addition to environment approvals ---
          - task: ManualValidation@0
            displayName: 'Manual Approval: Confirm PROD deploy'
            timeoutInMinutes: 1440
            inputs:
              notifyUsers: ''   # optionally add emails
              instructions: |
                Please confirm PROD deployment for commit $(Build.SourceVersion).
                Branch: $(Build.SourceBranch)
                Artifact: $(artifactName)
              onTimeout: 'reject'

          - task: AzureWebApp@1
            displayName: 'Deploy ZIP to PROD App Service'
            inputs:
              azureSubscription: 'svc-conn-nexeagle-prod'   # <— CHANGE
              appType: 'webAppLinux'
              appName: '$(prodAppName)'
              package: '$(Pipeline.Workspace)/$(artifactName)/**/*.zip'
