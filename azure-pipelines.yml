# ============================================
#   Build & Deploy EasyHMS API (.NET 8)
#   Dev: release-* AND feature/*
#   QA : release-* only
#   PROD: release-* + date gate + server-side manual approval
# ============================================

parameters:
- name: deployProd
  type: boolean
  default: false
- name: prodReleaseDateUtc
  type: string
  default: ''   # e.g. "2025-12-05 10:30:00" (UTC)

trigger:
  branches:
    include:
      - 'release-*'
      - 'feature/*'

pr:
  branches:
    include:
      - 'release-*'
      - 'feature/*'

pool:
  vmImage: 'ubuntu-latest'

variables:
  apiProject: 'EasyHMSAPI.Api/EasyHMSAPI.Api.csproj'
  publishDir: '$(Build.ArtifactStagingDirectory)/publish'
  artifactName: 'api-drop'

  # Dev App Service
  devAppName: 'easyHMSAPIServices'
  devResourceGroup: 'website-dev-rg'

  # QA App Service
  qaAppName: 'easyHMSAPISevices'
  qaResourceGroup: 'website-qa-rg'

  # PROD App Service
  prodAppName: 'easyHMSAPISevicesProd'       # <— CHANGE
  prodResourceGroup: 'website-prod-rg'        # <— CHANGE

stages:
# ---------------- Build ----------------
- stage: Build
  displayName: Build & Package API
  jobs:
  - job: BuildJob
    steps:
    - task: UseDotNet@2
      displayName: 'Use .NET 8 SDK'
      inputs: { version: '8.x' }

    - task: DotNetCoreCLI@2
      displayName: 'Restore'
      inputs: { command: 'restore', projects: '$(apiProject)' }

    - task: DotNetCoreCLI@2
      displayName: 'Build'
      inputs:
        command: 'build'
        projects: '$(apiProject)'
        arguments: '--configuration Release --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Publish (zip)'
      inputs:
        command: 'publish'
        projects: '$(apiProject)'
        arguments: '--configuration Release --no-restore --output $(publishDir)'
        publishWebProjects: false
        zipAfterPublish: true

    - publish: $(publishDir)
      artifact: $(artifactName)

# ---------------- Dev ----------------
- stage: Deploy_Dev
  displayName: Deploy to App Service (Dev)
  dependsOn: Build
  condition: >
    and(
      succeeded(),
      or(
        startsWith(variables['Build.SourceBranch'], 'refs/heads/release-'),
        startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/')
      )
    )
  jobs:
  - deployment: DeployDev
    environment: 'dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: $(artifactName)

          - task: AzureWebApp@1
            displayName: 'Deploy ZIP to Dev App Service'
            inputs:
              azureSubscription: 'svc-conn-nexeagle-dev'   # <— correct for DEV
              appType: 'webAppLinux'
              appName: '$(devAppName)'
              package: '$(Pipeline.Workspace)/$(artifactName)/**/*.zip'

# ---------------- QA ----------------
- stage: Deploy_QA
  displayName: Deploy to App Service (QA)
  dependsOn: Deploy_Dev
  condition: >
    and(
      succeeded(),
      startsWith(variables['Build.SourceBranch'], 'refs/heads/release-')
    )
  jobs:
  - deployment: DeployQA
    environment: 'qa'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: $(artifactName)

          - task: AzureWebApp@1
            displayName: 'Deploy ZIP to QA App Service'
            inputs:
              azureSubscription: 'svc-conn-nexeagle-qa'    # <— correct for QA
              appType: 'webAppLinux'
              appName: '$(qaAppName)'
              package: '$(Pipeline.Workspace)/$(artifactName)/**/*.zip'

# ---------------- PROD Gate (manual) ----------------
- stage: Prod_Gate
  displayName: PROD Gate (Manual Approval)
  dependsOn: Deploy_QA
  condition: >
    and(
      succeeded(),
      startsWith(variables['Build.SourceBranch'], 'refs/heads/release-'),
      eq('${{ parameters.deployProd }}', 'true')
    )
  jobs:
  - job: WaitProdApproval
    displayName: 'Manual approval for PROD'
    pool: server
    timeoutInMinutes: 1440
    steps:
    - task: ManualValidation@0
      displayName: 'Approve PROD deployment'
      inputs:
        notifyUsers: ''    # optional emails
        instructions: |
          Please confirm PROD deployment for commit $(Build.SourceVersion).
          Branch: $(Build.SourceBranch)
          Artifact: $(artifactName)
        onTimeout: 'reject'

# ---------------- PROD (date WAIT + deploy) ----------------
- stage: Deploy_Prod
  displayName: Deploy to App Service (PROD)
  dependsOn: Prod_Gate
  condition: succeeded()
  jobs:
  - deployment: DeployProd
    environment: 'prod'    # set Approvals & Checks in Environments if desired
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: $(artifactName)

          # ✅ WAIT until prodReleaseDateUtc instead of failing early
          - bash: |
              set -euo pipefail
              REL='${{ parameters.prodReleaseDateUtc }}'

              if [ -z "$REL" ]; then
                echo "Parameter prodReleaseDateUtc is required for PROD."
                exit 1
              fi

              rel=$(date -u -d "$REL" +%s 2>/dev/null || true)
              if [ -z "$rel" ]; then
                echo "Invalid prodReleaseDateUtc format: $REL"
                echo "Use e.g. '2025-12-05 10:30:00' (UTC)"
                exit 1
              fi

              echo "Target release (UTC): $REL"
              echo "Current (UTC): $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

              now=$(date -u +%s)
              while [ "$now" -lt "$rel" ]; do
                rem=$(( rel - now ))
                printf 'Waiting %s seconds until %s UTC...\n' "$rem" "$REL"
                sleep 15
                now=$(date -u +%s)
              done

              echo "Reached release time. Proceeding to PROD deployment."
            displayName: 'Gate: wait until PROD release time (UTC)'

          - task: AzureWebApp@1
            displayName: 'Deploy ZIP to PROD App Service'
            inputs:
              azureSubscription: 'svc-conn-nexeagle-prod'   # <— FIXED: use PROD connection
              appType: 'webAppLinux'
              appName: '$(prodAppName)'
              package: '$(Pipeline.Workspace)/$(artifactName)/**/*.zip'
