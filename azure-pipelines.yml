# ============================================
# EasyHMS API (.NET 8) CI/CD
# - Build: release-* & feature/*
# - Dev:   release-* & feature/*
# - QA:    release-* only
# - PROD:  release-* only, Environment approval required
# ============================================

parameters:
- name: deployProd
  type: boolean
  default: false   # set true at run time to enable PROD stage

trigger:
  branches:
    include:
      - 'release-*'
      - 'feature/*'

pr:
  branches:
    include:
      - 'release-*'
      - 'feature/*'

pool:
  vmImage: 'ubuntu-latest'

# ===== EDIT THESE VALUES =====
variables:
  apiProject: 'EasyHMSAPI.Api/EasyHMSAPI.Api.csproj'
  publishDir: '$(Build.ArtifactStagingDirectory)/publish'
  packageDir: '$(Build.ArtifactStagingDirectory)/package'
  artifactName: 'api-drop'

  # Dev
  devAppName: 'easyHMSAPIServices'
  devResourceGroup: 'website-dev-rg'
  devServiceConnection: 'svc-conn-nexeagle-dev'

  # QA
  qaAppName: 'easyHMSAPISevices'
  qaResourceGroup: 'website-qa-rg'
  qaServiceConnection: 'svc-conn-nexeagle-qa'

  # PROD  <<< EDIT THESE
  prodAppName: 'easyHMSAPISevicesProd'
  prodResourceGroup: 'website-prod-rg'
  prodServiceConnection: 'svc-conn-nexeagle-prod'

stages:
# ===================== Build =====================
- stage: Build
  displayName: Build & Package API
  jobs:
  - job: BuildJob
    steps:
    - task: UseDotNet@2
      displayName: 'Use .NET 8 SDK'
      inputs:
        version: '8.x'

    - task: DotNetCoreCLI@2
      displayName: 'Restore'
      inputs:
        command: 'restore'
        projects: '$(apiProject)'

    - task: DotNetCoreCLI@2
      displayName: 'Build'
      inputs:
        command: 'build'
        projects: '$(apiProject)'
        arguments: '--configuration Release --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Publish (folder)'
      inputs:
        command: 'publish'
        projects: '$(apiProject)'
        arguments: '--configuration Release --no-restore --output $(publishDir)'
        publishWebProjects: false
        zipAfterPublish: false

    # Create deterministic zip: site.zip
    - task: ArchiveFiles@2
      displayName: 'Archive publish → site.zip'
      inputs:
        rootFolderOrFile: '$(publishDir)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(packageDir)/site.zip'
        replaceExistingArchive: true

    - publish: '$(packageDir)'
      artifact: $(artifactName)

# ===================== Deploy Dev =====================
- stage: Deploy_Dev
  displayName: Deploy to App Service (Dev)
  dependsOn: Build
  condition: >
    and(
      succeeded(),
      or(
        startsWith(variables['Build.SourceBranch'],'refs/heads/release-'),
        startsWith(variables['Build.SourceBranch'],'refs/heads/feature/')
      )
    )
  jobs:
  - deployment: DeployDev
    environment: 'dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: $(artifactName)

          # Ensure app is running (avoid Kudu 403 Site Disabled)
          - task: AzureCLI@2
            displayName: 'Ensure Dev App is Running'
            inputs:
              azureSubscription: '$(devServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                RG='$(devResourceGroup)'
                APP='$(devAppName)'
                state=$(az webapp show -g "$RG" -n "$APP" --query state -o tsv || echo "")
                echo "Current state: ${state:-Unknown}"
                if [ "$state" != "Running" ]; then
                  echo "Starting app..."
                  az webapp start -g "$RG" -n "$APP"
                fi

          - task: AzureWebApp@1
            displayName: 'Deploy to Dev App Service'
            inputs:
              azureSubscription: '$(devServiceConnection)'
              appType: 'webAppLinux'
              appName: '$(devAppName)'
              package: '$(Pipeline.Workspace)/$(artifactName)/site.zip'

# ===================== Deploy QA =====================
- stage: Deploy_QA
  displayName: Deploy to App Service (QA)
  dependsOn: Deploy_Dev
  condition: >
    and(
      succeeded(),
      startsWith(variables['Build.SourceBranch'],'refs/heads/release-')
    )
  jobs:
  - deployment: DeployQA
    environment: 'qa'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: $(artifactName)

          - task: AzureCLI@2
            displayName: 'Ensure QA App is Running'
            inputs:
              azureSubscription: '$(qaServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                RG='$(qaResourceGroup)'
                APP='$(qaAppName)'
                state=$(az webapp show -g "$RG" -n "$APP" --query state -o tsv || echo "")
                echo "Current state: ${state:-Unknown}"
                if [ "$state" != "Running" ]; then
                  echo "Starting app..."
                  az webapp start -g "$RG" -n "$APP"
                fi

          - task: AzureWebApp@1
            displayName: 'Deploy to QA App Service'
            inputs:
              azureSubscription: '$(qaServiceConnection)'
              appType: 'webAppLinux'
              appName: '$(qaAppName)'
              package: '$(Pipeline.Workspace)/$(artifactName)/site.zip'

# ===================== Deploy PROD =====================
- stage: Deploy_Prod
  displayName: Deploy to App Service (PROD) — Environment Approval
  dependsOn: Deploy_QA
  condition: >
    and(
      succeeded(),
      startsWith(variables['Build.SourceBranch'],'refs/heads/release-'),
      eq('${{ parameters.deployProd }}','true')
    )
  jobs:
  - deployment: DeployProd
    # Configure approvals in Pipelines → Environments → prod → Approvals and checks
    environment: 'prod'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: $(artifactName)

          - task: AzureCLI@2
            displayName: 'Ensure PROD App is Running'
            inputs:
              azureSubscription: '$(prodServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                RG='$(prodResourceGroup)'
                APP='$(prodAppName)'
                state=$(az webapp show -g "$RG" -n "$APP" --query state -o tsv || echo "")
                echo "Current state: ${state:-Unknown}"
                if [ "$state" != "Running" ]; then
                  echo "Starting app..."
                  az webapp start -g "$RG" -n "$APP"
                fi

          - task: AzureWebApp@1
            displayName: 'Deploy to PROD App Service'
            inputs:
              azureSubscription: '$(prodServiceConnection)'
              appType: 'webAppLinux'
              appName: '$(prodAppName)'
              package: '$(Pipeline.Workspace)/$(artifactName)/site.zip'
