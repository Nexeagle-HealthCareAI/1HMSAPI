# ============================================
#   Build & Deploy EasyHMS API (.NET 8)
#   Dev: release-* AND feature/*
#   QA : release-* only
#   PROD: release-* + server-side ManualValidation + UTC date gate
# ============================================

# -------- Parameters (for PROD gating) --------
parameters:
- name: deployProd
  type: boolean
  default: false
- name: prodReleaseDateUtc
  type: string
  default: ''   # e.g. "2025-12-05 10:30:00" (UTC)

trigger:
  branches:
    include:
      - 'release-*'
      - 'feature/*'

pr:
  branches:
    include:
      - 'release-*'
      - 'feature/*'

pool:
  vmImage: 'ubuntu-latest'

# ==== EDIT THESE VALUES ====
variables:
  apiProject: 'EasyHMSAPI.Api/EasyHMSAPI.Api.csproj'
  publishDir: '$(Build.ArtifactStagingDirectory)/publish'
  artifactName: 'api-drop'

  # Dev App Service
  devAppName: 'easyHMSAPIServices'
  devResourceGroup: 'website-dev-rg'

  # QA App Service
  qaAppName: 'easyHMSAPISevices'
  qaResourceGroup: 'website-qa-rg'

  # PROD App Service
  prodAppName: 'easyHMSAPISevicesProd'     # <— CHANGE
  prodResourceGroup: 'website-prod-rg'      # <— CHANGE

stages:
# ================================================================
#  STAGE 1 — Build (release-* & feature/*)
# ================================================================
- stage: Build
  displayName: Build & Package API
  jobs:
  - job: BuildJob
    steps:
    - task: UseDotNet@2
      displayName: 'Use .NET 8 SDK'
      inputs: { version: '8.x' }

    - task: DotNetCoreCLI@2
      displayName: 'Restore'
      inputs: { command: 'restore', projects: '$(apiProject)' }

    - task: DotNetCoreCLI@2
      displayName: 'Build'
      inputs:
        command: 'build'
        projects: '$(apiProject)'
        arguments: '--configuration Release --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Publish (zip)'
      inputs:
        command: 'publish'
        projects: '$(apiProject)'
        arguments: '--configuration Release --no-restore --output $(publishDir)'
        publishWebProjects: false
        zipAfterPublish: true

    - publish: $(publishDir)
      artifact: $(artifactName)

# ================================================================
#  STAGE 2 — Deploy DEV (release-* & feature/*)
# ================================================================
- stage: Deploy_Dev
  displayName: Deploy to App Service (Dev)
  dependsOn: Build
  condition: >
    and(
      succeeded(),
      or(
        startsWith(variables['Build.SourceBranch'], 'refs/heads/release-'),
        startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/')
      )
    )
  jobs:
  - deployment: DeployDev
    environment: 'dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: $(artifactName)

          # Find the single .zip we published and store in $(PkgPath)
          - bash: |
              set -euo pipefail
              f=$(ls -1 "$(Pipeline.Workspace)/$(artifactName)"/**/*.zip | head -n1 || true)
              if [ -z "$f" ]; then
                echo "No publish zip found"; exit 1
              fi
              echo "Using package: $f"
              echo "##vso[task.setvariable variable=PkgPath]$f"
            displayName: 'Detect package zip'

          # Ensure app is running (avoids Kudu 403 Site Disabled)
          - task: AzureCLI@2
            displayName: 'Ensure Dev app is Running (and show plan SKU)'
            inputs:
              azureSubscription: 'svc-conn-nexeagle-dev'   # <— CHANGE if needed
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                RG='$(devResourceGroup)'
                APP='$(devAppName)'

                echo "Checking state of $APP in $RG ..."
                state=$(az webapp show -g "$RG" -n "$APP" --query state -o tsv || echo 'unknown')
                echo "Current state: $state"
                if [ "$state" != "Running" ]; then
                  echo "Starting app..."
                  az webapp start -g "$RG" -n "$APP" >/dev/null
                fi

                PLAN_ID=$(az webapp show -g "$RG" -n "$APP" --query serverFarmId -o tsv || true)
                PLAN_NAME=$(basename "$PLAN_ID" || echo '')
                if [ -n "$PLAN_NAME" ]; then
                  SKU=$(az appservice plan show -g "$RG" -n "$PLAN_NAME" --query sku.tier -o tsv || echo 'unknown')
                  echo "App Service Plan: $PLAN_NAME  SKU: $SKU"
                  if [ "$SKU" = "Free" ] || [ "$SKU" = "Shared" ]; then
                    echo "##vso[task.logissue type=warning]Plan is $SKU. Free/Shared can hit daily CPU quota and disable the site until 00:00 UTC. Consider B1+."
                  fi
                fi

          - task: AzureWebApp@1
            displayName: 'Deploy ZIP to Dev App Service'
            inputs:
              azureSubscription: 'svc-conn-nexeagle-dev'   # <— CHANGE
              appType: 'webAppLinux'                       # If Windows, use 'webApp'
              appName: '$(devAppName)'
              package: '$(PkgPath)'

# ================================================================
#  STAGE 3 — Deploy QA (release-* only)
# ================================================================
- stage: Deploy_QA
  displayName: Deploy to App Service (QA)
  dependsOn: Deploy_Dev
  condition: >
    and(
      succeeded(),
      startsWith(variables['Build.SourceBranch'], 'refs/heads/release-')
    )
  jobs:
  - deployment: DeployQA
    environment: 'qa'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: $(artifactName)

          - bash: |
              set -euo pipefail
              f=$(ls -1 "$(Pipeline.Workspace)/$(artifactName)"/**/*.zip | head -n1 || true)
              if [ -z "$f" ]; then
                echo "No publish zip found"; exit 1
              fi
              echo "Using package: $f"
              echo "##vso[task.setvariable variable=PkgPath]$f"
            displayName: 'Detect package zip (QA)'

          - task: AzureCLI@2
            displayName: 'Ensure QA app is Running (and show plan SKU)'
            inputs:
              azureSubscription: 'svc-conn-nexeagle-qa'    # <— CHANGE
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                RG='$(qaResourceGroup)'
                APP='$(qaAppName)'
                state=$(az webapp show -g "$RG" -n "$APP" --query state -o tsv || echo 'unknown')
                if [ "$state" != "Running" ]; then
                  az webapp start -g "$RG" -n "$APP" >/dev/null
                fi
                PLAN_ID=$(az webapp show -g "$RG" -n "$APP" --query serverFarmId -o tsv || true)
                PLAN_NAME=$(basename "$PLAN_ID" || echo '')
                if [ -n "$PLAN_NAME" ]; then
                  SKU=$(az appservice plan show -g "$RG" -n "$PLAN_NAME" --query sku.tier -o tsv || echo 'unknown')
                  echo "QA Plan: $PLAN_NAME  SKU: $SKU"
                fi

          - task: AzureWebApp@1
            displayName: 'Deploy ZIP to QA App Service'
            inputs:
              azureSubscription: 'svc-conn-nexeagle-qa'    # <— CHANGE
              appType: 'webAppLinux'                       # If Windows, use 'webApp'
              appName: '$(qaAppName)'
              package: '$(PkgPath)'

# ================================================================
#  STAGE 4 — PROD Gate (server-side ManualValidation)
# ================================================================
- stage: Prod_Gate
  displayName: PROD Gate (Manual Approval)
  dependsOn: Deploy_QA
  condition: >
    and(
      succeeded(),
      startsWith(variables['Build.SourceBranch'], 'refs/heads/release-'),
      eq('${{ parameters.deployProd }}', 'true')
    )
  jobs:
  - job: WaitProdApproval
    displayName: 'Manual approval for PROD'
    pool: server          # ManualValidation requires agentless/server job
    timeoutInMinutes: 1440
    steps:
    - task: ManualValidation@0
      displayName: 'Approve PROD deployment'
      inputs:
        notifyUsers: ''    # optionally comma-separated AAD emails
        instructions: |
          Please confirm PROD deployment for commit $(Build.SourceVersion).
          Branch: $(Build.SourceBranch)
          Artifact: $(artifactName)
        onTimeout: 'reject'

# ================================================================
#  STAGE 5 — Deploy PROD (date gate + deploy)
# ================================================================
- stage: Deploy_Prod
  displayName: Deploy to App Service (PROD)
  dependsOn: Prod_Gate
  condition: succeeded()
  jobs:
  - deployment: DeployProd
    environment: 'prod'    # configure Approvals & Checks in Environments if desired
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: $(artifactName)

          # Optional: date gate (UTC) so you can run pipeline earlier, deploy at/after time
          - bash: |
              set -euo pipefail
              REL='${{ parameters.prodReleaseDateUtc }}'
              if [ -z "$REL" ]; then
                echo "Parameter prodReleaseDateUtc not provided; skipping time gate."
                exit 0
              fi
              now=$(date -u +%s)
              rel=$(date -u -d "$REL" +%s || true)
              if [ -z "$rel" ]; then
                echo "Invalid prodReleaseDateUtc format: $REL"
                echo "Use e.g. '2025-12-05 10:30:00' (UTC)"; exit 1
              fi
              if [ $now -lt $rel ]; then
                echo "Release blocked until $REL UTC"; exit 2
              fi
              echo "Release date gate passed (now >= $REL UTC)."
            displayName: 'Gate: PROD release date (UTC)'

          - bash: |
              set -euo pipefail
              f=$(ls -1 "$(Pipeline.Workspace)/$(artifactName)"/**/*.zip | head -n1 || true)
              if [ -z "$f" ]; then
                echo "No publish zip found"; exit 1
              fi
              echo "Using package: $f"
              echo "##vso[task.setvariable variable=PkgPath]$f"
            displayName: 'Detect package zip (PROD)'

          - task: AzureCLI@2
            displayName: 'Ensure PROD app is Running (and show plan SKU)'
            inputs:
              azureSubscription: 'svc-conn-nexeagle-prod'  # <— CHANGE
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                RG='$(prodResourceGroup)'
                APP='$(prodAppName)'
                state=$(az webapp show -g "$RG" -n "$APP" --query state -o tsv || echo 'unknown')
                if [ "$state" != "Running" ]; then
                  az webapp start -g "$RG" -n "$APP" >/dev/null
                fi
                PLAN_ID=$(az webapp show -g "$RG" -n "$APP" --query serverFarmId -o tsv || true)
                PLAN_NAME=$(basename "$PLAN_ID" || echo '')
                if [ -n "$PLAN_NAME" ]; then
                  SKU=$(az appservice plan show -g "$RG" -n "$PLAN_NAME" --query sku.tier -o tsv || echo 'unknown')
                  echo "PROD Plan: $PLAN_NAME  SKU: $SKU"
                fi

          - task: AzureWebApp@1
            displayName: 'Deploy ZIP to PROD App Service'
            inputs:
              azureSubscription: 'svc-conn-nexeagle-prod'  # <— CHANGE
              appType: 'webAppLinux'                       # If Windows, use 'webApp'
              appName: '$(prodAppName)'
              package: '$(PkgPath)'
