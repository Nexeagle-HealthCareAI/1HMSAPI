trigger:
  branches:
    include:
      - main
      - release-*

pool:
  vmImage: 'ubuntu-latest'

variables:
  apiProject: 'EasyHMSAPI.Api/EasyHMSAPI.Api.csproj'
  publishDir: '$(Build.ArtifactStagingDirectory)/publish'
  artifactName: 'api-drop'

  # Dev App Service
  devAppName: 'easyHMSAPIServices'
  devResourceGroup: 'website-dev-rg'

  # QA App Service
  qaAppName: 'easyHMSAPISevices'   # <-- keep as-is if that's really the app name; otherwise fix to easyHMSAPIServices
  qaResourceGroup: 'website-qa-rg'

stages:
# ===================== Build once =====================
- stage: Build
  displayName: Build & Package API
  jobs:
  - job: BuildJob
    steps:
    - task: UseDotNet@2
      displayName: 'Use .NET 8 SDK'
      inputs:
        version: '8.x'

    - task: DotNetCoreCLI@2
      displayName: 'Restore'
      inputs:
        command: 'restore'
        projects: '$(apiProject)'

    - task: DotNetCoreCLI@2
      displayName: 'Build'
      inputs:
        command: 'build'
        projects: '$(apiProject)'
        arguments: '--configuration Release --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Publish (zip)'
      inputs:
        command: 'publish'
        projects: '$(apiProject)'
        arguments: '--configuration Release --no-restore --output $(publishDir)'
        publishWebProjects: false
        zipAfterPublish: true

    - publish: $(publishDir)
      artifact: $(artifactName)

# ===================== Deploy to Dev =====================
- stage: Deploy_Dev
  displayName: Deploy to App Service (Dev)
  dependsOn: Build
  condition: and(succeeded(), not(startsWith(variables['Build.SourceBranch'], 'refs/heads/release-')))
  jobs:
  - deployment: DeployDev
    environment: 'dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: $(artifactName)

          - task: AzureWebApp@1
            displayName: 'Deploy ZIP to Dev App Service'
            inputs:
              azureSubscription: 'svc-conn-nexeagle-dev'
              appType: 'webAppLinux'
              appName: '$(devAppName)'
              package: '$(Pipeline.Workspace)/$(artifactName)/**/*.zip'

# ===================== Deploy to QA =====================
- stage: Deploy_QA
  displayName: Deploy to App Service (QA)
  dependsOn: Build
  condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/heads/release-'))
  jobs:
  - deployment: DeployQA
    environment: 'qa'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: $(artifactName)

          - task: AzureWebApp@1
            displayName: 'Deploy ZIP to QA App Service'
            inputs:
              azureSubscription: 'svc-conn-nexeagle-qa'
              appType: 'webAppLinux'
              appName: '$(qaAppName)'
              package: '$(Pipeline.Workspace)/$(artifactName)/**/*.zip'
