# ============================================
#   Build, Test (80% Coverage Gate) & Deploy
#   EasyHMS API (.NET 8)
# ============================================

parameters:
- name: deployProd
  type: boolean
  default: false

trigger:
  branches:
    include:
      - 'release-*'
      - 'feature/*'

pr:
  branches:
    include:
      - 'release-*'
      - 'feature/*'

pool:
  vmImage: 'ubuntu-latest'

variables:
  apiProject: 'EasyHMSAPI.Api/EasyHMSAPI.Api.csproj'
  testProjects: '**/*Tests/*.csproj'   # adjust if your test csproj naming differs
  publishDir: '$(Build.ArtifactStagingDirectory)/publish'
  artifactName: 'api-drop'

  # Coverage
  coverageThreshold: '80'
  testResultsDir: '$(Build.SourcesDirectory)/TestResults'
  coverageDir: '$(Build.SourcesDirectory)/TestResults/CoverageReport'

  # Dev
  devAppName: 'easyHMSAPIServices'
  devServiceConnection: 'svc-conn-nexeagle-dev'

  # QA
  qaAppName: 'easyHMSAPIServices'
  qaServiceConnection: 'svc-conn-nexeagle-qa'

  # PROD
  prodAppName: 'easyHMSAPIServicesProd'
  prodServiceConnection: 'svc-conn-nexeagle-prod'

stages:

# ================================================================
#  STAGE 1 — Build + Unit Tests + Coverage Gate (>= 80%)
# ================================================================
- stage: Build_Test
  displayName: Build + Unit Tests + Coverage Gate
  jobs:
  - job: BuildTestJob
    displayName: Build/Test
    steps:
    - checkout: self

    - task: UseDotNet@2
      displayName: 'Use .NET 8 SDK'
      inputs:
        version: '8.x'

    - task: DotNetCoreCLI@2
      displayName: 'Restore'
      inputs:
        command: 'restore'
        projects: '$(apiProject)'

    - task: DotNetCoreCLI@2
      displayName: 'Build'
      inputs:
        command: 'build'
        projects: '$(apiProject)'
        arguments: '--configuration Release --no-restore'

    # ---------- UNIT TESTS + COVERAGE ----------
    - task: DotNetCoreCLI@2
      displayName: 'Test (with coverage)'
      inputs:
        command: 'test'
        projects: '$(testProjects)'
        arguments: >
          --configuration Release
          --collect:"XPlat Code Coverage"
          --logger "trx"
          --results-directory "$(testResultsDir)"
        publishTestResults: false

    - task: PublishTestResults@2
      displayName: 'Publish Unit Test Results'
      inputs:
        testResultsFormat: 'VSTest'
        testResultsFiles: '$(testResultsDir)/**/*.trx'
        testRunTitle: 'Unit Tests'
      condition: succeededOrFailed()

    # Install ReportGenerator to convert coverage.cobertura.xml into nice report
    - script: |
        dotnet tool update --global dotnet-reportgenerator-globaltool || dotnet tool install --global dotnet-reportgenerator-globaltool
        echo '##vso[task.prependpath]'"$HOME/.dotnet/tools"
      displayName: 'Install ReportGenerator'

    # Generate report + enforce 80% line coverage
    - script: |
        set -e

        echo "Finding cobertura files..."
        files=$(find "$(testResultsDir)" -name "coverage.cobertura.xml" || true)

        if [ -z "$files" ]; then
          echo "No coverage.cobertura.xml found. Ensure coverlet.collector is added to test projects."
          exit 1
        fi

        echo "Coverage files:"
        echo "$files"

        mkdir -p "$(coverageDir)"

        reportgenerator \
          -reports:"$(testResultsDir)/**/coverage.cobertura.xml" \
          -targetdir:"$(coverageDir)" \
          -reporttypes:"HtmlInline_AzurePipelines;Cobertura"

        # Parse line-rate from Cobertura
        cobertura="$(coverageDir)/Cobertura.xml"
        if [ ! -f "$cobertura" ]; then
          echo "Cobertura.xml not generated at $cobertura"
          exit 1
        fi

        line_rate=$(python - << 'PY'
import xml.etree.ElementTree as ET
tree = ET.parse(r"$(coverageDir)/Cobertura.xml")
root = tree.getroot()
# Cobertura: line-rate is 0..1
lr = root.attrib.get("line-rate")
print(lr if lr else "0")
PY
        )

        pct=$(python - << 'PY'
lr = float("$line_rate")
print(int(round(lr * 100)))
PY
        )

        echo "Line coverage: ${pct}%"
        thr=$(coverageThreshold)

        if [ "$pct" -lt "$thr" ]; then
          echo "Coverage gate failed: ${pct}% < ${thr}%"
          exit 1
        fi

        echo "Coverage gate passed: ${pct}% >= ${thr}%"
      displayName: 'Coverage Report + 80% Gate'

    - task: PublishCodeCoverageResults@2
      displayName: 'Publish Coverage to Azure DevOps'
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: '$(coverageDir)/Cobertura.xml'
        reportDirectory: '$(coverageDir)'
        failIfCoverageEmpty: true

    # ---------- PUBLISH ARTIFACT FOR DEPLOY ----------
    - task: DotNetCoreCLI@2
      displayName: 'Publish API (zip)'
      inputs:
        command: 'publish'
        projects: '$(apiProject)'
        arguments: '--configuration Release --no-restore --output $(publishDir)'
        publishWebProjects: false
        zipAfterPublish: true

    - publish: $(publishDir)
      artifact: $(artifactName)

# ================================================================
#  STAGE 2 — Deploy DEV
# ================================================================
- stage: Deploy_Dev
  displayName: Deploy to App Service (Dev)
  dependsOn: Build_Test
  condition: >
    and(
      succeeded(),
      ne(variables['Build.Reason'], 'PullRequest')
    )
  jobs:
  - deployment: DeployDev
    environment: 'dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: $(artifactName)

          - task: AzureWebApp@1
            displayName: 'Deploy ZIP to Dev App Service'
            inputs:
              azureSubscription: '$(devServiceConnection)'
              appType: 'webAppLinux'
              appName: '$(devAppName)'
              package: '$(Pipeline.Workspace)/$(artifactName)/**/*.zip'

# ================================================================
#  STAGE 3 — Deploy QA (release-* only)
# ================================================================
- stage: Deploy_QA
  displayName: Deploy to App Service (QA)
  dependsOn: Deploy_Dev
  condition: >
    and(
      succeeded(),
      ne(variables['Build.Reason'], 'PullRequest'),
      startsWith(variables['Build.SourceBranch'], 'refs/heads/release-')
    )
  jobs:
  - deployment: DeployQA
    environment: 'qa'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: $(artifactName)

          - task: AzureWebApp@1
            displayName: 'Deploy ZIP to QA App Service'
            inputs:
              azureSubscription: '$(qaServiceConnection)'
              appType: 'webAppLinux'
              appName: '$(qaAppName)'
              package: '$(Pipeline.Workspace)/$(artifactName)/**/*.zip'

# ================================================================
#  STAGE 4 — Deploy PROD (manual + approval)
# ================================================================
- stage: Deploy_Prod
  displayName: Deploy to App Service (PROD) — Environment Approval
  dependsOn: Deploy_QA
  condition: >
    and(
      succeeded(),
      ne(variables['Build.Reason'], 'PullRequest'),
      startsWith(variables['Build.SourceBranch'], 'refs/heads/release-'),
      eq(${{ parameters.deployProd }}, true)
    )
  jobs:
  - deployment: DeployProd
    environment: 'prod'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: $(artifactName)

          - task: AzureWebApp@1
            displayName: 'Deploy ZIP to PROD App Service'
            inputs:
              azureSubscription: '$(prodServiceConnection)'
              appType: 'webAppLinux'
              appName: '$(prodAppName)'
              package: '$(Pipeline.Workspace)/$(artifactName)/**/*.zip'
