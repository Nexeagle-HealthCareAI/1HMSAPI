# ============================================
#   Build, Unit Test (60% Coverage Gate) & Deploy
#   EasyHMS API (.NET 8)
#
#   Dev deploy : release-* AND feature/*
#   PROD deploy: release-* only + deployProd=true + env approval
#   PR builds  : Build + Tests only (no deploy)
# ============================================

parameters:
- name: deployProd
  type: boolean
  default: false

trigger:
  branches:
    include:
      - 'release-*'
      - 'feature/*'

pr:
  branches:
    include:
      - 'release-*'
      - 'feature/*'

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Projects
  apiProject: 'EasyHMSAPI.Api/EasyHMSAPI.Api.csproj'

  # Adjust this to match your repo naming:
  # examples:
  #   '**/*UnitTests/*.csproj'
  #   '**/*UnitTests.csproj'
  #   '**/*Test*.csproj'
  testProjects: '**/*UnitTests/*.csproj'

  # Artifacts
  publishDir: '$(Build.ArtifactStagingDirectory)/publish'
  artifactName: 'api-drop'

  # Coverage
  coverageThreshold: '60'
  testResultsDir: '$(Build.SourcesDirectory)/TestResults'
  coverageReportDir: '$(Build.SourcesDirectory)/TestResults/CoverageReport'

  # Dev
  devAppName: 'easyHMSAPIServices'
  devServiceConnection: 'svc-conn-nexeagle-dev'

  # PROD
  prodAppName: 'easyHMSAPIServicesProd'
  prodServiceConnection: 'svc-conn-nexeagle-prod'

stages:

# ================================================================
#  STAGE 1 — Build + Unit Tests + Coverage Gate (>= 60%)
# ================================================================
- stage: Build_Test
  displayName: Build + Unit Tests + Coverage Gate
  jobs:
  - job: BuildTestJob
    displayName: Build/Test
    steps:
    - checkout: self

    - task: UseDotNet@2
      displayName: 'Use .NET 8 SDK'
      inputs:
        version: '8.x'

    - task: DotNetCoreCLI@2
      displayName: 'Restore API'
      inputs:
        command: 'restore'
        projects: '$(apiProject)'

    # Optional but recommended: restore tests explicitly
    - task: DotNetCoreCLI@2
      displayName: 'Restore Tests'
      inputs:
        command: 'restore'
        projects: '$(testProjects)'

    - task: DotNetCoreCLI@2
      displayName: 'Build API'
      inputs:
        command: 'build'
        projects: '$(apiProject)'
        arguments: '--configuration Release --no-restore'

    # ---------- UNIT TESTS + COVERAGE ----------
    - task: DotNetCoreCLI@2
      displayName: 'Unit Tests (with coverage)'
      inputs:
        command: 'test'
        projects: '$(testProjects)'
        arguments: >
          --configuration Release
          --collect:"XPlat Code Coverage"
          --logger "trx"
          --results-directory "$(testResultsDir)"
          -- RunConfiguration.TreatNoTestsAsError=true
        publishTestResults: false

    - task: PublishTestResults@2
      displayName: 'Publish Unit Test Results'
      inputs:
        testResultsFormat: 'VSTest'
        testResultsFiles: '$(testResultsDir)/**/*.trx'
        testRunTitle: 'Unit Tests'
      condition: succeededOrFailed()

    # ---------- COVERAGE REPORT + GATE ----------
    - script: |
        set -euo pipefail

        # Install reportgenerator (global tool)
        dotnet tool update --global dotnet-reportgenerator-globaltool || dotnet tool install --global dotnet-reportgenerator-globaltool
        export PATH="$PATH:$HOME/.dotnet/tools"

        RESULTS_DIR="$(testResultsDir)"
        REPORT_DIR="$(coverageReportDir)"
        THRESHOLD="$(coverageThreshold)"

        echo "Searching for cobertura coverage files in: $RESULTS_DIR"
        if ! find "$RESULTS_DIR" -name "coverage.cobertura.xml" | grep -q .; then
          echo "No coverage.cobertura.xml found."
          echo "Fix: ensure each test project references coverlet.collector package."
          exit 1
        fi

        mkdir -p "$REPORT_DIR"

        # IMPORTANT: quote args so YAML never mis-parses -reports: etc.
        reportgenerator \
          "-reports:$RESULTS_DIR/**/coverage.cobertura.xml" \
          "-targetdir:$REPORT_DIR" \
          "-reporttypes:HtmlInline_AzurePipelines;Cobertura"

        COBERTURA="$REPORT_DIR/Cobertura.xml"
        if [ ! -f "$COBERTURA" ]; then
          echo "Cobertura.xml not generated at $COBERTURA"
          exit 1
        fi

        # Cobertura line-rate is 0..1
        LINE_RATE=$(python3 -c "import xml.etree.ElementTree as ET; r=ET.parse('$COBERTURA').getroot(); print(r.attrib.get('line-rate','0'))")
        PCT=$(python3 -c "print(int(round(float('$LINE_RATE')*100)))")

        echo "Line coverage: ${PCT}% (threshold: ${THRESHOLD}%)"
        if [ "$PCT" -lt "$THRESHOLD" ]; then
          echo "Coverage gate failed: ${PCT}% < ${THRESHOLD}%"
          exit 1
        fi

        echo "Coverage gate passed."
      displayName: 'Coverage Report + 60% Gate'

    - task: PublishCodeCoverageResults@2
      displayName: 'Publish Coverage'
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: '$(coverageReportDir)/Cobertura.xml'
        reportDirectory: '$(coverageReportDir)'
        failIfCoverageEmpty: true

    # ---------- PUBLISH API ZIP ARTIFACT FOR DEPLOY ----------
    - task: DotNetCoreCLI@2
      displayName: 'Publish API (zip)'
      inputs:
        command: 'publish'
        projects: '$(apiProject)'
        arguments: '--configuration Release --no-restore --output $(publishDir)'
        publishWebProjects: false
        zipAfterPublish: true

    - publish: '$(publishDir)'
      artifact: '$(artifactName)'

# ================================================================
#  STAGE 2 — Deploy DEV (release-* and feature/*, NOT on PR)
# ================================================================
- stage: Deploy_Dev
  displayName: Deploy to App Service (Dev)
  dependsOn: Build_Test
  condition: >
    and(
      succeeded(),
      ne(variables['Build.Reason'], 'PullRequest'),
      or(
        startsWith(variables['Build.SourceBranch'], 'refs/heads/release-'),
        startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/')
      )
    )
  jobs:
  - deployment: DeployDev
    displayName: Deploy Dev
    environment: 'dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: $(artifactName)

          - task: AzureWebApp@1
            displayName: 'Deploy ZIP to Dev App Service'
            inputs:
              azureSubscription: '$(devServiceConnection)'
              appType: 'webAppLinux'
              appName: '$(devAppName)'
              package: '$(Pipeline.Workspace)/$(artifactName)/**/*.zip'

# ================================================================
#  STAGE 3 — Deploy PROD (release-* + deployProd=true + approval)
#  Configure approvals in Pipelines → Environments → prod
# ================================================================
- stage: Deploy_Prod
  displayName: Deploy to App Service (PROD) — Environment Approval
  dependsOn: Deploy_Dev
  condition: >
    and(
      succeeded(),
      ne(variables['Build.Reason'], 'PullRequest'),
      startsWith(variables['Build.SourceBranch'], 'refs/heads/release-'),
      eq(${{ parameters.deployProd }}, true)
    )
  jobs:
  - deployment: DeployProd
    displayName: Deploy PROD
    environment: 'prod'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: $(artifactName)

          - task: AzureWebApp@1
            displayName: 'Deploy ZIP to PROD App Service'
            inputs:
              azureSubscription: '$(prodServiceConnection)'
              appType: 'webAppLinux'
              appName: '$(prodAppName)'
              package: '$(Pipeline.Workspace)/$(artifactName)/**/*.zip'
