# ============================================
# EasyHMS API (.NET 8) CI/CD
# - Build: release-* & feature/*
# - Dev:   release-* & feature/*
# - QA:    release-* only
# - Prod:  release-* only (no time gate; approvals via Environment)
# ============================================

parameters:
- name: deployProd
  type: boolean
  default: false   # enable at run time if you want to deploy to PROD

trigger:
  branches:
    include:
      - 'release-*'
      - 'feature/*'

pr:
  branches:
    include:
      - 'release-*'
      - 'feature/*'

pool:
  vmImage: 'ubuntu-latest'

# ===== EDIT THESE VALUES =====
variables:
  apiProject: 'EasyHMSAPI.Api/EasyHMSAPI.Api.csproj'
  publishDir: '$(Build.ArtifactStagingDirectory)/publish'
  artifactName: 'api-drop'

  # Dev
  devAppName: 'easyHMSAPIServices'
  devResourceGroup: 'website-dev-rg'
  devServiceConnection: 'svc-conn-nexeagle-dev'

  # QA
  qaAppName: 'easyHMSAPISevices'
  qaResourceGroup: 'website-qa-rg'
  qaServiceConnection: 'svc-conn-nexeagle-qa'

  # PROD (optional)
  prodAppName: 'easyHMSAPISevicesProd'
  prodResourceGroup: 'website-prod-rg'
  prodServiceConnection: 'svc-conn-nexeagle-prod'

stages:
# ===================== Build =====================
- stage: Build
  displayName: Build & Package API
  jobs:
  - job: BuildJob
    steps:
    - task: UseDotNet@2
      displayName: 'Use .NET 8 SDK'
      inputs:
        version: '8.x'

    - task: DotNetCoreCLI@2
      displayName: 'Restore'
      inputs:
        command: 'restore'
        projects: '$(apiProject)'

    - task: DotNetCoreCLI@2
      displayName: 'Build'
      inputs:
        command: 'build'
        projects: '$(apiProject)'
        arguments: '--configuration Release --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Publish (zip)'
      inputs:
        command: 'publish'
        projects: '$(apiProject)'
        arguments: '--configuration Release --no-restore --output $(publishDir)'
        publishWebProjects: false
        zipAfterPublish: true

    - publish: $(publishDir)
      artifact: $(artifactName)

# ===================== Deploy Dev =====================
- stage: Deploy_Dev
  displayName: Deploy to App Service (Dev)
  dependsOn: Build
  condition: >
    and(
      succeeded(),
      or(
        startsWith(variables['Build.SourceBranch'],'refs/heads/release-'),
        startsWith(variables['Build.SourceBranch'],'refs/heads/feature/')
      )
    )
  jobs:
  - deployment: DeployDev
    environment: 'dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: $(artifactName)

          # Resolve the published zip to $(PKG)
          - bash: |
              set -euo pipefail
              PKG=$(ls -1 "$(Pipeline.Workspace)/$(artifactName)"/**/*.zip | head -n1 || true)
              if [ -z "$PKG" ]; then
                echo "No publish zip found"; exit 1
              fi
              echo "##vso[task.setvariable variable=PKG]$PKG"
              echo "Package: $PKG"
            displayName: 'Detect package zip (DEV)'

          # Make sure the site is running (avoids Kudu 403 "Site Disabled")
          - task: AzureCLI@2
            displayName: 'Ensure Dev App is Running'
            inputs:
              azureSubscription: '$(devServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                RG='$(devResourceGroup)'
                APP='$(devAppName)'

                state=$(az webapp show -g "$RG" -n "$APP" --query state -o tsv || echo "")
                echo "Current state: ${state:-Unknown}"
                if [ "$state" != "Running" ]; then
                  echo "Starting app..."
                  az webapp start -g "$RG" -n "$APP"
                fi

                # Optional: clear stale run-from-package setting if previously used
                # az webapp config appsettings delete -g "$RG" -n "$APP" --setting-names WEBSITE_RUN_FROM_PACKAGE || true

                # Show SCM access default (should be Allow unless you've locked it down)
                az webapp config show -g "$RG" -n "$APP" --query 'scmIpSecurityRestrictionsDefaultAction' -o tsv || true

          - task: AzureWebApp@1
            displayName: 'Deploy to Dev App Service'
            inputs:
              azureSubscription: '$(devServiceConnection)'
              appType: 'webAppLinux'
              appName: '$(devAppName)'
              package: '$(PKG)'

# ===================== Deploy QA =====================
- stage: Deploy_QA
  displayName: Deploy to App Service (QA)
  dependsOn: Deploy_Dev
  condition: >
    and(
      succeeded(),
      startsWith(variables['Build.SourceBranch'],'refs/heads/release-')
    )
  jobs:
  - deployment: DeployQA
    environment: 'qa'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: $(artifactName)

          - bash: |
              set -euo pipefail
              PKG=$(ls -1 "$(Pipeline.Workspace)/$(artifactName)"/**/*.zip | head -n1 || true)
              if [ -z "$PKG" ]; then
                echo "No publish zip found"; exit 1
              fi
              echo "##vso[task.setvariable variable=PKG]$PKG"
              echo "Package: $PKG"
            displayName: 'Detect package zip (QA)'

          - task: AzureCLI@2
            displayName: 'Ensure QA App is Running'
            inputs:
              azureSubscription: '$(qaServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                RG='$(qaResourceGroup)'
                APP='$(qaAppName)'
                state=$(az webapp show -g "$RG" -n "$APP" --query state -o tsv || echo "")
                echo "Current state: ${state:-Unknown}"
                if [ "$state" != "Running" ]; then
                  echo "Starting app..."
                  az webapp start -g "$RG" -n "$APP"
                fi

          - task: AzureWebApp@1
            displayName: 'Deploy to QA App Service'
            inputs:
              azureSubscription: '$(qaServiceConnection)'
              appType: 'webAppLinux'
              appName: '$(qaAppName)'
              package: '$(PKG)'

# ===================== Deploy Prod (optional) =====================
- stage: Deploy_Prod
  displayName: Deploy to App Service (PROD)
  dependsOn: Deploy_QA
  condition: >
    and(
      succeeded(),
      startsWith(variables['Build.SourceBranch'],'refs/heads/release-'),
      eq('${{ parameters.deployProd }}','true')
    )
  jobs:
  - deployment: DeployProd
    # Use Environment 'prod' to require approvals (Project Settings → Pipelines → Environments)
    environment: 'prod'
    strategy:
      runOnce:
        deploy:
          steps:
          # IMPORTANT: this downloads the SAME artifact built earlier (same run → same zip)
          - download: current
            artifact: $(artifactName)

          - bash: |
              set -euo pipefail
              PKG=$(ls -1 "$(Pipeline.Workspace)/$(artifactName)"/**/*.zip | head -n1 || true)
              if [ -z "$PKG" ]; then
                echo "No publish zip found"; exit 1
              fi
              echo "##vso[task.setvariable variable=PKG]$PKG"
              echo "Package: $PKG"
            displayName: 'Detect package zip (PROD)'

          - task: AzureCLI@2
            displayName: 'Ensure PROD App is Running'
            inputs:
              azureSubscription: '$(prodServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                RG='$(prodResourceGroup)'
                APP='$(prodAppName)'
                state=$(az webapp show -g "$RG" -n "$APP" --query state -o tsv || echo "")
                echo "Current state: ${state:-Unknown}"
                if [ "$state" != "Running" ]; then
                  echo "Starting app..."
                  az webapp start -g "$RG" -n "$APP"
                fi

          - task: AzureWebApp@1
            displayName: 'Deploy to PROD App Service'
            inputs:
              azureSubscription: '$(prodServiceConnection)'
              appType: 'webAppLinux'
              appName: '$(prodAppName)'
              package: '$(PKG)'
